<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG9 Verwaltung</title>
<link rel="icon" href="/assets/mark.svg">
<link rel="stylesheet" href="/assets/sg9.css">
<script src="/assets/theme.js"></script>
<style>
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--surface) 231px, var(--line) 231px, var(--line) 232px, transparent 232px); }
aside { background: var(--surface); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
aside .top { padding: 18px 18px 14px; }
nav { padding: 4px 10px; flex: 1; overflow: auto; }
nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; cursor: pointer; font-size: var(--t-s); font-weight: 550; position: relative; }
nav a svg { width: 18px; height: 18px; flex: none; }
nav a:hover { background: var(--line-soft); color: var(--ink); }
nav a.on { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
nav a.on::before { content: ""; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--petrol); }
nav a .n { margin-left: auto; font-size: var(--t-xs); color: var(--ink-3); font-weight: 500; }
nav .gap { height: 14px; }
aside .foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: var(--t-xs); color: var(--ink-3); }
main { min-width: 0; padding: 22px 32px 48px; }
.head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: var(--t-xl); letter-spacing: -.015em; font-weight: 700; }
.head p { margin: 2px 0 0; color: var(--ink-2); font-size: var(--t-s); }
.head .tools { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.online { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); }

/* Frontplatte */
.faceplate { background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 16px; padding: 18px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--shadow); }
.faceplate .ident { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 0 4px 4px; }
.faceplate .ident b { font-size: var(--t-l); font-weight: 700; letter-spacing: -.01em; display: block; }
.faceplate .ident .state { display: flex; align-items: center; gap: 8px; font-size: var(--t-s); color: var(--ink-2); }
.port { background: var(--raised); border: 1px solid var(--plate-edge); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0;
  box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--plate-edge) 70%, transparent); }
.port .t { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: var(--t-m); }
.port .addr { font-family: var(--mono); font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.port .meta { font-size: var(--t-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.port.off { background: transparent; box-shadow: none; }
.off-note { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--ink-3); padding: 2px 4px 0; }
.off-note a { color: var(--ink-2); }
.port.off .t { color: var(--ink-3); }
.port .count { font-size: var(--t-xs); color: var(--ink-2); }
.port .count b { color: var(--ink); font-weight: 650; }

.trace { margin-top: 18px; display: grid; grid-template-columns: 210px 1fr; }
.trace .now { padding: 18px 20px; border-right: 1px solid var(--line-soft); display: grid; align-content: center; gap: 16px; }
.trace .now .k { font-size: var(--t-xs); color: var(--ink-3); display: flex; align-items: center; gap: 7px; }
.trace .now .v { font-size: var(--t-xxl); font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.trace .now .v small { font-size: var(--t-m); color: var(--ink-2); font-weight: 500; margin-left: 3px; }
.trace .now .down .v { color: var(--petrol); } .trace .now .up .v { color: var(--amber); }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.trace .chart { position: relative; height: 230px; padding: 14px 16px 10px 6px; }
.trace canvas { width: 100%; height: 100%; display: block; }

.ledger { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); }
.ledger section { padding: 16px 20px; }
.ledger section + section { border-left: 1px solid var(--line-soft); }
.ledger h3 { margin: 0 0 8px; font-size: var(--t-s); color: var(--ink-2); font-weight: 600; }
.ledger dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: var(--t-s); }
.ledger dt { color: var(--ink-2); } .ledger dd { margin: 0; text-align: right; font-weight: 600; }
.ledger dd a { cursor: pointer; text-decoration: none; }

/* Editor */
.split { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
.list { padding: 8px; position: sticky; top: 16px; }
.list .item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: var(--t-s); }
.list .item:hover { background: var(--surface); }
.list .item.on { background: var(--petrol-soft); }
.list .item .meta { margin-left: auto; font-size: var(--t-xs); color: var(--ink-3); }
.list .item.disabled .nm { color: var(--ink-3); text-decoration: line-through; }
.list .search { margin-bottom: 6px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--ink-2); font-size: var(--t-s); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--petrol); }
.tabpanel { padding: 20px; display: grid; gap: 22px; }
.tabpanel h3 { margin: 0 0 10px; font-size: var(--t-s); font-weight: 650; }
.tabpanel section > p.hint { margin: -4px 0 12px; }
.perms { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.mount { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: grid; gap: 10px; }
.mount .row input { font-family: var(--mono); font-size: 12.5px; }
.mounts { display: grid; gap: 8px; }
.edit-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line-soft); align-items: center; }
.edit-actions .left { margin-right: auto; display: flex; gap: 8px; }
.protos { display: flex; flex-wrap: wrap; gap: 8px 18px; }

/* Ereignisse */
.event { padding: 16px 20px; display: grid; gap: 12px; border-bottom: 1px solid var(--line-soft); }
.event:last-child { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: var(--t-xs); cursor: pointer; background: var(--raised); }
.chips label:has(input:checked) { background: var(--petrol-soft); border-color: var(--petrol); color: var(--petrol); }
.chips input { display: none; }

/* Protokoll */
.logbox { font: 12.5px/1.6 var(--mono); height: calc(100vh - 220px); overflow: auto; padding: 10px 0; }
.logline { padding: 1px 18px; white-space: pre-wrap; word-break: break-word; }
.logline .t { color: var(--ink-3); }
.logline .l { display: inline-block; width: 7ch; font-weight: 600; }
.lv-info .l { color: var(--ink-2); } .lv-warn .l { color: var(--amber); } .lv-error .l { color: var(--red); } .lv-xfer .l { color: var(--petrol); }
.logline .w { color: var(--ink-3); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar .input { width: auto; }

.settings { display: grid; gap: 18px; }
.settings .panel-body { display: grid; gap: 16px; }
.settings > *, .split > *, main > *, .panel-body > * { min-width: 0; }
.ports td { vertical-align: middle; }
@media (max-width: 760px) { .ports td:last-child, .ports th:last-child { display: none; } .ports [data-host] { min-width: 110px !important; } .ports td, .ports th { padding: 8px; } .panel-head { flex-wrap: wrap; } }
.ports tr:hover td { background: transparent; }
.svc { display: grid; grid-template-columns: 200px 1fr; gap: 14px 24px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
.svc:last-child { border-bottom: 0; padding-bottom: 4px; }
.svc:first-child { padding-top: 4px; }
.svc .lbl b { display: block; font-size: var(--t-m); }
.sticky-save { flex-wrap: wrap; position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 0 6px; display: flex; gap: 8px; justify-content: flex-end; }

.picker .dir { padding: 8px 10px; border-radius: 7px; cursor: pointer; font-family: var(--mono); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.picker .dir:hover { background: var(--surface); }
.picker .where { font: 12.5px var(--mono); color: var(--ink-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.copyline { display: flex; gap: 6px; align-items: center; }
.backups { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 4px 18px; margin-top: 6px; font-size: var(--t-s); }
.twofa-setup { display: grid; gap: 14px; justify-items: center; }
.twofa-setup .steps, .twofa-setup .field { justify-self: stretch; }
.qrbox { width: 210px; height: 210px; background: #fff; border-radius: 10px; padding: 6px; }
.qrbox svg { width: 100%; height: 100%; display: block; }
.secret { font-size: 13px; letter-spacing: .04em; color: var(--ink-2); user-select: all; text-align: center; }
.codes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 14px; background: var(--surface); border-radius: 10px; font-size: 15px; }
.codes span { text-align: center; }
.notify-kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 10px 22px; }
.nk { align-items: flex-start !important; white-space: normal !important; }
.nk input { margin-top: 3px !important; }
.nk > span { display: grid; gap: 1px; }
.nk b { font-weight: 600; }
pre.yaml { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 12px; overflow: auto; white-space: pre; }
.acme-state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 9px; background: var(--surface); font-size: var(--t-s); }
.acme-state > span:nth-child(2) { flex: 1; min-width: 200px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: var(--t-s); color: var(--ink-2); }
.steps b { color: var(--ink); font-weight: 600; }
.picker-box { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); overflow: hidden; font-weight: 400; color: var(--ink); }
.picker-bar { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); background: var(--surface); }
.picker-list { max-height: 260px; overflow: auto; padding: 4px; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; min-height: 38px; }
.pick-row:hover { background: var(--surface); }
.pick-row[aria-selected="true"] { background: var(--petrol-soft); box-shadow: inset 0 0 0 1px var(--petrol); }
.pick-ico { width: 18px; height: 18px; display: inline-flex; flex: none; }
.pick-ico svg { width: 18px; height: 18px; }
.pick-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.picker-sel { padding: 8px 12px; border-top: 1px solid var(--line-soft); font-size: var(--t-xs); color: var(--ink-2); background: var(--surface); }
.picker-sel .mono { color: var(--ink); }
.copyline .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }

@media (max-width: 980px) {
  .ledger { grid-template-columns: 1fr; } .ledger section + section { border-left: 0; border-top: 1px solid var(--line-soft); }
  .trace { grid-template-columns: 1fr; } .trace .now { border-right: 0; border-bottom: 1px solid var(--line-soft); grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: 1fr; } .list { position: static; }
  .svc { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app > * { min-width: 0; }
  .app { background: none; }
  aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; width: 100%; overflow: hidden; border-right: 0; border-bottom: 1px solid var(--line); }
  aside .top { padding: 12px 16px; } aside .foot { display: none; }
  nav { display: flex; overflow-x: auto; flex-basis: 100%; width: 100%; padding: 0 8px 8px; }
  nav a { white-space: nowrap; } nav .gap { display: none; } nav a .n { display: none; }
  nav a.on::before { display: none; }
  main { padding: 18px 16px 40px; }
  .faceplate { grid-template-columns: 1fr 1fr; }
  .faceplate .ident { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// ---------- Grundlagen ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtBytes = n => { n = Number(n) || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; };
const splitUnit = s => { const i = s.lastIndexOf(" "); return [s.slice(0, i), s.slice(i + 1)]; };
const fmtRate = n => fmtBytes(n) + "/s";
const fmtDur = s => { s = Math.max(0, Math.floor(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} T ${h} h` : h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`; };
const fmtTime = t => new Date(t).toLocaleTimeString("de-CH");
const fmtDate = t => new Date(t).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" });
const fmtDay = d => d ? new Date(d + "T00:00").toLocaleDateString("de-CH") : "";
const ago = t => fmtDur((Date.now() - new Date(t)) / 1000);
const nf = n => Number(n || 0).toLocaleString("de-CH");
const num = v => Number(v) || 0;
const lines = a => (a || []).join("\n");
const unlines = s => s.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
const keylines = s => s.split(/\n+/).map(x => x.trim()).filter(Boolean);

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "X-SG9": "1", "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
  if (r.status === 401 && url !== "/api/login") { boot(); throw new Error("Nicht angemeldet"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, bad) {
  let box = $("#toasts"); if (!box) { box = document.createElement("div"); box.id = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = (bad ? "" : '<span class="led on"></span>') + "<span></span>"; t.lastChild.textContent = msg;
  box.appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
async function copy(text, label = "Link kopiert") { try { await navigator.clipboard.writeText(text); toast(label); } catch { prompt("Kopieren:", text); } }

const I = {
  status: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="7.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><path d="M16 12h3"/>',
  sessions: '<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18.5" cy="17" r="1.5"/>',
  users: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4.2-6.5 8-6.5s7 2.1 8 6.5"/>',
  groups: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.6 5.2"/>',
  shares: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  events: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
  notify: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  logs: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 19h4"/>',
  bans: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
};
const icon = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

const PERMS = [["list", "Auflisten"], ["read", "Lesen"], ["write", "Schreiben"], ["append", "Anhängen"], ["delete", "Löschen"], ["rename", "Umbenennen"], ["mkdir", "Ordner anlegen"], ["rmdir", "Ordner löschen"]];
const permBoxes = (prefix, p = {}, disabled = false) => `<div class="perms">${PERMS.map(([k, l]) =>
  `<label class="check"><input type="checkbox" data-perm="${prefix}.${k}" ${p[k] ? "checked" : ""} ${disabled ? "disabled" : ""}>${l}</label>`).join("")}</div>`;
const readPerms = (root, prefix) => Object.fromEntries(PERMS.map(([k]) => [k, !!root.querySelector(`[data-perm="${prefix}.${k}"]`)?.checked]));
const PROTOS = [["ftp", "FTP/FTPS"], ["sftp", "SFTP"], ["webdav", "WebDAV"], ["web", "Browser"]];
const PROTO_LABEL = { ftp: "FTP", ftps: "FTPS", sftp: "SFTP", webdav: "WebDAV", web: "Browser", share: "Link" };

const state = { view: location.hash.slice(1) || "status", timer: null, status: null, logSince: 0, logs: [], logPaused: false, sel: {}, tab: {} };

// ---------- Einrichtung & Anmeldung ----------
const gate = inner => `<div class="gate"><form id="lf">
    <div class="plate"><span class="mark"><img src="/assets/mark.svg" alt="" width="34" height="34"><span><b>SG9</b><small>Verwaltung</small></span></span>${inner}</div>
    <div class="under"><span></span><span data-theme-switch data-compact></span></div></form></div>`;

function showSetup(st) {
  clearInterval(state.timer);
  if (!st.canSetup) {
    $("#root").innerHTML = gate(`<p style="margin:0">SG9 ist noch nicht eingerichtet.</p>
      <p class="muted" style="margin:0;font-size:var(--t-s)">Öffne die Verwaltung einmal auf dem Rechner, auf dem SG9 läuft, oder von einem Gerät im selben Netz, und lege dort das Passwort fest.</p>`);
    $$("[data-theme-switch]").forEach(SG9Theme.render);
    return;
  }
  $("#root").innerHTML = gate(`
      <p style="margin:0;font-size:var(--t-l);font-weight:650">Willkommen</p>
      <p class="muted" style="margin:-6px 0 0;font-size:var(--t-s)">Leg fest, mit welchem Passwort du die Verwaltung öffnest.</p>
      <label class="field">Benutzer<input name="u" value="${esc(st.username || "admin")}" autocomplete="username" required></label>
      <label class="field">Passwort<input name="p" type="password" autocomplete="new-password" minlength="8" autofocus required><span class="hint">Mindestens 8 Zeichen.</span></label>
      <label class="field">Passwort wiederholen<input name="p2" type="password" autocomplete="new-password" minlength="8" required></label>
      ${st.local ? `<label class="check" style="white-space:normal;align-items:flex-start"><input type="checkbox" name="nl" checked style="margin-top:3px"><span>Auf diesem Rechner nicht nach dem Passwort fragen<br><span class="hint">Von anderen Geräten braucht es weiterhin das Passwort. Abschalten, wenn auch andere Leute diesen Rechner benutzen.</span></span></label>` : ""}
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn primary">Passwort festlegen und loslegen</button>`);
  $$("[data-theme-switch]").forEach(SG9Theme.render);
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    if (f.p.value !== f.p2.value) { $("#lerr").textContent = "Die beiden Passwörter sind nicht gleich."; f.p2.focus(); return; }
    try { await api("POST", "/api/setup", { username: f.u.value, password: f.p.value, localNoLogin: !!f.nl?.checked }); boot(); }
    catch (err) { $("#lerr").textContent = err.message; }
  };
}

function showLogin(st) {
  clearInterval(state.timer);
  $("#root").innerHTML = gate(`
      <label class="field">Benutzer<input name="u" value="${esc(st?.username || "admin")}" autocomplete="username" required></label>

function drawChart(hist) {
  const c = $("#chart"); if (!c) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (!W || !H) return;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const pts = hist.slice(-120), N = 120;
  const max = Math.max(4096, ...pts.map(p => Math.max(p.down, p.up)));
  let scale = 1024; outer: for (let e = 1024; ; e *= 10) for (const s of [1, 2, 5]) { if (s * e >= max) { scale = s * e; break outer; } }
  const L = 72, R = 6, T = 6, B = 22, w = W - L - R, h = H - T - B;
  g.font = "11.5px " + col("--sans"); g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = Math.round(T + h - h * i / 4) + .5;
    g.strokeStyle = col(i ? "--line-soft" : "--line"); g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
    g.fillStyle = col("--ink-3"); g.textAlign = "right"; g.fillText(fmtRate(scale * i / 4), L - 10, y + 4);
  }
  g.textAlign = "left"; g.fillText("vor 2 Minuten", L, H - 4); g.textAlign = "right"; g.fillText("jetzt", W - R, H - 4);
  const x = i => L + w * (N - pts.length + i) / (N - 1), y = v => T + h - h * Math.min(v, scale) / scale;
  const line = (key, color) => {
    if (!pts.length) return;
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(x(i), y(p[key])) : g.moveTo(x(i), y(p[key])));
    g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
    g.lineTo(x(pts.length - 1), T + h); g.lineTo(x(0), T + h); g.closePath();
    g.globalAlpha = .1; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
  };
  line("up", col("--amber")); line("down", col("--petrol"));
}

// ---------- Ordnerauswahl (Server) ----------
function pickFolder(input) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box picker" role="dialog" aria-label="Ordner wählen"><header>Ordner auf dem Server wählen</header><div class="body" id="dirs"></div>
    <footer><span class="where" id="crumb"></span><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="ok">Diesen Ordner nehmen</button></footer></div>`;
  document.body.appendChild(m);
  let cur = "";
  const load = async p => {
    try {
      const r = await api("GET", "/api/browse?path=" + encodeURIComponent(p));
      cur = r.path || "";
      $("#crumb", m).textContent = cur || "Laufwerke";
      $("#ok", m).disabled = !cur;
      const up = cur && (r.parent || cur !== "/") ? `<div class="dir" data-p="${esc(r.parent)}">${icon("up", "faint")}..</div>` : "";
      $("#dirs", m).innerHTML = up + (r.dirs.length ? r.dirs.map(d => `<div class="dir" data-p="${esc(cur ? (cur.endsWith(r.sep) ? cur + d : cur + r.sep + d) : d)}"><span style="color:var(--amber);display:inline-flex;width:18px">${icon("folder")}</span>${esc(d)}</div>`).join("") : `<div class="empty">Keine Unterordner</div>`);
      $$(".dir", m).forEach(d => d.onclick = () => load(d.dataset.p));
    } catch (err) { toast(err.message, true); }
  };
  const close = () => m.remove();
  $("#cancel", m).onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  m.onkeydown = e => { if (e.key === "Escape") close(); };
  $("#ok", m).onclick = () => { input.value = cur; close(); };
  load(input.value && !input.value.includes("%") ? input.value : "");
}

async function viewShares() {
  setHead("Freigabe-Links", "Dateien und Ordner per Link teilen, auch mit Leuten ohne Konto");
  const [list, st] = await Promise.all([api("GET", "/api/shares"), api("GET", "/api/settings")]).catch(e => { toast(e.message, true); return [[], null]; });
  const web = st?.settings.web || {};
  const warn = !web.enabled || !web.shares ? `<div class="panel" style="padding:14px 18px;margin-bottom:16px;border-color:var(--amber)"><b>Freigabe-Links sind ausgeschaltet.</b> <span class="muted">Unter Einstellungen → Dienste den Web-Zugang und Freigabe-Links einschalten, sonst funktionieren die Links nicht.</span></div>` : "";
  $("#main").innerHTML = `${warn}<div class="toolbar"><button class="btn primary" id="newshare">Link erstellen</button><span class="hint">Teilen kannst du jeden Ordner und jede Datei auf dem Server oder etwas aus einem Benutzerkonto. Von ausserhalb erreichbar machst du Links unter Einstellungen.</span></div>
    <div class="panel" style="overflow:auto"><table class="data"><thead><tr><th>Link</th><th>Inhalt</th><th>Art</th><th>Downloads</th><th>Gültig bis</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.length ? list.map(s => {
      const status = s.disabled ? '<span class="pill">pausiert</span>' : s.expired ? '<span class="pill bad">abgelaufen</span>' : '<span class="pill ok">aktiv</span>';
      return `<tr><td><div class="copyline"><span class="mono" title="${esc(s.url)}">/s/${esc(s.id)}</span><button class="btn small" data-copy="${esc(s.url)}">Kopieren</button><button class="btn small" data-qr="${esc(s.url)}" title="QR-Code anzeigen">QR</button></div>${s.comment ? `<div class="hint">${esc(s.comment)}</div>` : ""}</td>
        <td>${s.realPath ? `<div>Server</div><div class="mono faint" style="font-size:12px">${esc(s.path === "/" ? s.realPath : s.realPath.replace(/[\/\\]$/, "") + s.path)}</div>` : `<div>${esc(s.owner)}</div><div class="mono faint" style="font-size:12px">${esc(s.path)}</div>`}</td>
        <td>${s.upload ? "Briefkasten" : "Download"}${s.password ? ' <span class="pill" title="mit Passwort geschützt">Passwort</span>' : ""}</td>
        <td>${s.upload ? "–" : nf(s.downloads) + (s.maxDownloads ? " von " + nf(s.maxDownloads) : "")}</td><td>${s.expiresAt ? fmtDay(s.expiresAt) : "unbegrenzt"}</td><td>${status}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn small" data-toggle="${s.id}" data-on="${s.disabled ? 0 : 1}">${s.disabled ? "Fortsetzen" : "Pausieren"}</button>
          ${s.maxDownloads && s.downloads >= s.maxDownloads ? `<button class="btn small" data-reset="${s.id}">Zähler zurück</button>` : ""}
          <button class="btn small danger" data-del="${s.id}">Löschen</button></td></tr>`;
    }).join("") : `<tr><td colspan="7"><div class="empty"><b>Noch keine Links</b>Erstelle einen Link für eine Datei, einen Ordner oder einen Briefkasten, in den andere Dateien hochladen können.</div></td></tr>`}
    </tbody></table></div>`;
  $("#newshare").onclick = () => shareDialog();
  $$("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
  $$("[data-qr]").forEach(b => b.onclick = () => showQR(b.dataset.qr, "Link /s/" + b.dataset.qr.split("/s/")[1]));
  $$("[data-toggle]").forEach(b => b.onclick = async () => { await api("PATCH", "/api/shares/" + b.dataset.toggle, { disabled: b.dataset.on === "1" }); viewShares(); });
  $$("[data-reset]").forEach(b => b.onclick = async () => { await api("PATCH", "/api/shares/" + b.dataset.reset, { resetDownloads: true }); viewShares(); });
  $$("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("Link löschen? Wer ihn hat, kommt dann nicht mehr an die Dateien.")) return; await api("DELETE", "/api/shares/" + b.dataset.del); toast("Link gelöscht"); viewShares(); tick(); });
}

  let src = "server", cwd = "", sep = "/", selected = "", selectedDir = true, items = [];

    }).join("") : `<div class="empty" style="padding:18px">${!cwd && src === "server" ? "Keine Laufwerke gefunden." : upload() ? "Keine Unterordner. Der Briefkasten kommt dann direkt in diesen Ordner." : "Dieser Ordner ist leer. Du kannst ihn trotzdem teilen."}</div>`;
    $$("[data-p]", tree).forEach(row => {
      row.onclick = e => { if (e.target.closest("[data-open]")) return; select(row.dataset.p, row.dataset.d === "1"); };

      row.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); select(row.dataset.p, row.dataset.d === "1"); } };
    });

  };

    tree.innerHTML = '<div class="empty" style="padding:18px">Lade …</div>';
    try {
      if (src === "user") {
        const r = await api("GET", `/api/users/${encodeURIComponent(f.owner.value)}/ls?path=${encodeURIComponent(p)}`);
        cwd = r.path; items = r.entries;
      } else {
        const r = await api("GET", `/api/browse?files=1&path=${encodeURIComponent(p)}`);
        sep = r.sep; cwd = r.path || "";
        items = [...r.dirs.map(d => ({ name: d, dir: true })), ...r.files.map(x => ({ name: x.name, size: x.size, dir: false }))];
        if (!cwd) items = r.dirs.map(d => ({ name: d.replace(/\\$/, ""), dir: true, drive: d }));
        try { localStorage.setItem("sg9-share-dir", cwd); } catch {}
      }
      select(cwd, true); draw();
      if (src === "server" && !cwd) select("", true);
    } catch (err) {
      items = []; crumbs();
      tree.innerHTML = `<div class="empty" style="padding:18px;color:var(--red)">${esc(err.message)}</div>`;
    }
  };
  const startServer = async () => {
    let start = "";
    try { start = localStorage.getItem("sg9-share-dir") || ""; } catch {}
    if (!start) { try { start = (await api("GET", "/api/browse?path=")).home || ""; } catch {} }
    await browse(start);
    if (start && !cwd) browse("");

    if (b.disabled) return;
    src = b.dataset.src; $$("#src button", m).forEach(x => x.setAttribute("aria-pressed", x === b));

  $("#pgo", m).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const v = e.target.value.trim(); if (v) browse(v); } };

  f.kind.onchange = () => { $("#maxdl", m).classList.toggle("hidden", upload()); if (upload() && !selectedDir) select(cwd, true); draw(); };
  f.onsubmit = async e => {
    e.preventDefault();

    const body = { upload: upload(), password: f.password.value, expiresAt: f.expiresAt.value, maxDownloads: num(f.maxDownloads.value), comment: f.comment.value };

    catch (err) { toast(err.message, true); }
  };
  startServer();
}

// Adresse "host:port" in Teile zerlegen und wieder zusammensetzen.
function splitAddr(a) {
  a = (a || "").trim(); if (!a) return { host: "", port: "" };
  const m = a.match(/^\[(.*)\]:(\d+)$/) || a.match(/^(.*):(\d+)$/);
  if (!m) return { host: "", port: a.replace(/\D/g, "") };
  const h = m[1] === "0.0.0.0" || m[1] === "::" ? "" : m[1];
  return { host: h, port: m[2] };
}
function joinAddr(host, port) {
  host = (host || "").trim(); port = String(port || "").trim();
  if (!port) return "";
  return (host.includes(":") ? "[" + host + "]" : host) + ":" + port;
}

    <div class="panel"><div class="panel-head"><h2>Sicherung und Umzug</h2></div><div class="panel-body" id="backup"></div></div>

        <label class="field">Gesperrte IP-Adressen<textarea name="ipDeny">${esc(lines(s.ipDeny))}</textarea></label></div>

      <div class="row" style="flex-wrap:wrap;gap:22px">${c("allowFXP", "FXP erlauben (Server zu Server)", s.allowFXP)}${c("followSymlinks", "Symbolischen Links auch ausserhalb der Ordner folgen", s.followSymlinks)}</div>
      <div class="grid-form">${i("certFile", "Eigenes Zertifikat (PEM)", s.tls.certFile, "text", 'placeholder="leer = selbst signiert"')}${i("keyFile", "Schlüssel dazu (PEM)", s.tls.keyFile)}</div></div></div>
    <div class="sticky-save"><button type="button" class="btn" id="pw">Admin-Passwort ändern</button><button class="btn primary">Einstellungen speichern</button></div>
  </form>`;
  const f = $("#sf");
  // Ausgeschaltete Dienste: Felder dimmen
  const dim = tr => { const on = tr.querySelector("[data-on]").checked; tr.querySelectorAll("[data-port],[data-host]").forEach(x => x.style.opacity = on ? 1 : .45); };
  $$("tr[data-row]", f).forEach(tr => { dim(tr); tr.querySelector("[data-on]").onchange = () => dim(tr); });
  const get = id => { const tr = $(`tr[data-row="${id}"]`, f); return { on: tr.querySelector("[data-on]").checked, addr: joinAddr(tr.querySelector("[data-host]").value, tr.querySelector("[data-port]").value), port: tr.querySelector("[data-port]").value.trim(), host: tr.querySelector("[data-host]").value.trim() }; };
  f.onsubmit = async e => {
    e.preventDefault();
    const ftp = get("ftp"), ftps = get("ftps"), sftp = get("sftp"), w = get("web"), dav = get("dav"), sh = get("share"), adm = get("admin");
    for (const [x, n, need] of [[ftp, "FTP", ftp.on], [sftp, "SFTP", sftp.on], [w, "Browser", w.on || (dav.on && !dav.port) || (sh.on && !sh.port)], [ftps, "FTPS implizit", ftps.on], [adm, "Verwaltung", true]])
      if (need && !/^\d{1,5}$/.test(x.port)) { toast(`${n}: bitte einen Port angeben`, true); return; }
    // WebDAV und Links ohne eigenen Port, aber mit eigener Adresse: Port des Browsers übernehmen
    const follow = x => x.port ? x.addr : (x.host ? joinAddr(x.host, w.port) : "");
    const body = { ...s, serverName: f.serverName.value, banner: f.banner.value, logFile: f.logFile.value.trim(),
      ftpEnabled: ftp.on, listenAddr: ftp.addr || s.listenAddr,
      passivePortMin: num(f.passivePortMin.value), passivePortMax: num(f.passivePortMax.value), publicIP: f.publicIP.value.trim(),
      maxConnections: num(f.maxConnections.value), maxConnPerIP: num(f.maxConnPerIP.value), idleTimeoutSec: num(f.idleTimeoutSec.value), loginTimeoutSec: num(f.loginTimeoutSec.value) || 60,
      globalDownloadKBps: num(f.globalDownloadKBps.value), globalUploadKBps: num(f.globalUploadKBps.value),
      allowFXP: f.allowFXP.checked, followSymlinks: f.followSymlinks.checked, dirMessages: f.dirMessages.checked,
      hideFiles: unlines(f.hideFiles.value), denyUpload: unlines(f.denyUpload.value), ipAllow: unlines(f.ipAllow.value), ipDeny: unlines(f.ipDeny.value),
      tls: { mode: f.tlsMode.value, implicitAddr: ftps.on ? ftps.addr : "", certFile: f.certFile.value.trim(), keyFile: f.keyFile.value.trim() },
      sftp: { enabled: sftp.on, listenAddr: sftp.addr || s.sftp.listenAddr },
      web: { enabled: w.on || dav.on || sh.on, listenAddr: w.addr || s.web.listenAddr, davAddr: follow(dav), shareAddr: follow(sh), useTLS: f.webTLS.checked,
        publicURL: f.publicURL.value.trim(), webClient: w.on, webdav: dav.on, shares: sh.on,
        acme: { enabled: f.acmeOn.checked, domain: f.acmeDomain.value.trim(), email: f.acmeEmail.value.trim() },
        geo: { enabled: f.geoOn.checked, dbPath: f.geoDB.value.trim(), allProto: f.geoAll.checked, allow: f.geoAllow.value.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean) } },
      antiHammer: { enabled: f.ahEnabled.checked, maxAttempts: num(f.ahMax.value), windowSec: num(f.ahWin.value), banSec: num(f.ahBan.value) },
      admin: { listenAddr: adm.addr, username: f.adminUser.value.trim(), useTLS: f.adminTLS.checked, localNoLogin: f.localNoLogin.checked } };
    try {
      const r = await api("PUT", "/api/settings", body);
      if (r.adminURL) {
        toast("Gespeichert. Die Verwaltung zieht um, du wirst weitergeleitet …");
        setTimeout(() => { location.href = r.adminURL; }, 1200);
        return;
      }
      toast("Einstellungen gespeichert"); if (body.admin.localNoLogin === false && state.auto) { boot(); return; } tick(); setTimeout(viewSettings, 400);
    } catch (err) { toast(err.message, true); }
  };
  $("#pw").onclick = () => passwordDialog();
  draw2FA(); drawBackup();
  // Let's Encrypt
  const sharePort = () => { const x = get("share"); return x.port || get("web").port; };
  const acmeUI = () => {
    const on = f.acmeOn.checked;
    $("#acmef").classList.toggle("hidden", !on); $("#acmesteps").classList.toggle("hidden", !on); $("#acmestate").classList.toggle("hidden", !on);
    $("#acmeport").textContent = sharePort();
    if (on) f.webTLS.checked = true;
  };
  f.acmeOn.onchange = acmeUI;
  $$('tr[data-row] [data-port]', f).forEach(x => x.addEventListener("input", acmeUI));
  acmeUI();
  const drawCert = async () => {
    if (!s.web.acme?.enabled) { $("#acmestate").innerHTML = `<span class="hint">Nach dem Speichern kannst du hier das Zertifikat holen.</span>`; return; }
    const c = await api("GET", "/api/cert").catch(() => null); if (!c) return;
    const days = c.notAfter ? Math.round((new Date(c.notAfter) - Date.now()) / 864e5) : 0;
    $("#acmestate").innerHTML = (c.valid
      ? `<span class="led on"></span><span>Zertifikat für <b>${esc(c.domain)}</b> ist aktiv, noch ${days} Tage gültig. SG9 erneuert es rechtzeitig.</span>`
      : `<span class="led ${c.lastError ? "err" : ""}"></span><span>${c.lastError ? esc(c.lastError) : "Noch kein Zertifikat für <b>" + esc(c.domain) + "</b>."}</span>`)
      + `<button type="button" class="btn small" id="acmeget">${c.valid ? "Jetzt erneuern" : "Zertifikat holen"}</button>`;
    $("#acmeget").onclick = async e => {
      e.target.disabled = true; e.target.textContent = "Frage bei Let's Encrypt an …";
      try { await api("POST", "/api/cert/request"); toast("Zertifikat ist da"); } catch (err) { toast(err.message, true); }
      drawCert();
    };
  };
  drawCert();
  // Länderfilter
  const geoUI = () => $("#geof").classList.toggle("hidden", !f.geoOn.checked);
  f.geoOn.onchange = geoUI; geoUI();
  (async () => {
    const g = await api("GET", "/api/geo").catch(() => null); if (!g) return;
    $("#geostate").innerHTML = `<span class="led ${g.ok ? "on" : s.web.geo?.dbPath ? "err" : ""}"></span><span>${esc(g.message)}</span>`
      + (g.ok ? `<input class="input" id="geoip" placeholder="IP-Adresse prüfen" style="width:180px"><button type="button" class="btn small" id="geotest">Prüfen</button>` : "");
    if ($("#geotest")) $("#geotest").onclick = async () => {
      try { const r = await api("GET", "/api/geo?ip=" + encodeURIComponent($("#geoip").value.trim())); toast(r.country ? `${r.ip}: ${r.country} – ${r.allowed ? "erlaubt" : "gesperrt"}` : `${r.ip}: Land unbekannt`); }
      catch (err) { toast(err.message, true); }
    };
  })();
}
async function drawBackup() {
  const box = $("#backup"); if (!box) return;
  const list = await api("GET", "/api/backups").catch(() => []);
  box.innerHTML = `<p class="hint" style="margin:0">Eine Sicherung enthält Einstellungen, Benutzer, Gruppen, Links, Ereignisse, Schlüssel und Zertifikate, aber nicht die Dateien selbst. Damit ziehst du SG9 auf einen anderen Rechner um, etwa auf den Unraid-Server.</p>
    <div class="row" style="flex-wrap:wrap"><a class="btn primary" href="/api/backup">Sicherung herunterladen</a><button type="button" class="btn" id="restore">Sicherung wiederherstellen …</button><input type="file" id="restorefile" accept=".zip,application/zip" hidden></div>
    <div><b style="font-size:var(--t-s)">Automatische Sicherungen</b><span class="hint"> · einmal täglich, die letzten 7 bleiben</span>
      ${list.length ? `<div class="backups">${list.map(b => `<a class="mono" href="/api/backups/${encodeURIComponent(b.name)}">${esc(b.name)}</a><span class="faint">${fmtBytes(b.size)}</span>`).join("")}</div>` : `<div class="hint" style="margin-top:4px">Die erste entsteht kurz nach dem Start.</div>`}</div>`;
  $("#restore").onclick = () => $("#restorefile").click();
  $("#restorefile").onchange = async e => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    if (!confirm(`Sicherung „${file.name}“ wiederherstellen? Alle Einstellungen, Benutzer und Links werden durch die aus der Sicherung ersetzt. Der jetzige Stand wird vorher automatisch gesichert.`)) return;
    try {
      const r = await fetch("/api/restore", { method: "POST", headers: { "X-SG9": "1", "Content-Type": "application/zip" }, body: file, credentials: "same-origin" });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.statusText);
      toast("Sicherung wiederhergestellt. Der vorherige Stand liegt unter Automatische Sicherungen.");
      setTimeout(() => location.reload(), 1500);
    } catch (err) { toast(err.message, true); }
  };
}
async function draw2FA() {
  const box = $("#twofa"); if (!box) return;
  const t = await api("GET", "/api/2fa").catch(() => null); if (!t) return;
  box.innerHTML = t.enabled
    ? `<div class="acme-state"><span class="led on"></span><span>Eingeschaltet. Beim Anmelden fragt SG9 zusätzlich nach dem Code aus deiner Authenticator-App. Noch <b>${t.recoveryLeft}</b> Wiederherstellungscodes übrig.</span><button type="button" class="btn small danger" id="off2fa">Ausschalten</button></div>
       ${t.localNoLogin ? `<p class="hint" style="margin:0">Direkt am Rechner, auf dem SG9 läuft, gilt weiterhin „ohne Passwort“. Das schaltest du unter Allgemein ab.</p>` : ""}`
    : `<div class="acme-state"><span class="led"></span><span>Aus. Mit Zwei-Faktor reicht ein gestohlenes Passwort nicht, um die Verwaltung zu öffnen. Empfohlen, sobald etwas von aussen erreichbar ist.</span><button type="button" class="btn small primary" id="on2fa">Einschalten</button></div>`;
  if ($("#on2fa")) $("#on2fa").onclick = setup2FA;
  if ($("#off2fa")) $("#off2fa").onclick = () => {
    const m = modalBox(`<form><header>Zwei-Faktor ausschalten</header><div class="body"><label class="field">Zur Bestätigung dein Passwort<input name="p" type="password" autocomplete="current-password" required></label></div>
      <footer><button type="button" class="btn" data-close>Abbrechen</button><button class="btn danger">Ausschalten</button></footer></form>`);
    const f = $("form", m); f.p.focus();
    f.onsubmit = async e => { e.preventDefault(); try { await api("POST", "/api/2fa/disable", { password: f.p.value }); m.remove(); toast("Zwei-Faktor ist aus"); draw2FA(); } catch (err) { toast(err.message, true); } };
  };
}

function modalBox(html) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog">${html}</div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m || e.target.closest("[data-close]")) m.remove(); };
  m.onkeydown = e => { if (e.key === "Escape") m.remove(); };
  return m;
}

      <label class="field">Code aus der App<input name="c" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" required></label>

  const f = $("form", m); f.c.focus();

      $(".box", m).innerHTML = `<header>Wiederherstellungscodes</header><div class="body" style="display:grid;gap:12px">
        <p style="margin:0">Zwei-Faktor ist eingeschaltet. <b>Bewahre diese Codes gut auf.</b> Ist dein Handy weg, kommst du mit einem davon wieder in die Verwaltung. Jeder Code funktioniert einmal, und du siehst sie nur jetzt.</p>
        <div class="codes mono">${r.recoveryCodes.map(c => `<span>${c}</span>`).join("")}</div></div>
        <footer><button type="button" class="btn" id="dlc">Als Datei speichern</button><button type="button" class="btn" id="cpc">Kopieren</button><button type="button" class="btn primary" data-close>Gespeichert, fertig</button></footer>`;
      $("#cpc", m).onclick = () => copy(text, "Codes kopiert");
      $("#dlc", m).onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" })); a.download = "sg9-wiederherstellungscodes.txt"; a.click(); };

  $("#main").innerHTML = `${logTabs("live")}<div class="toolbar"><select class="input" id="lvl" aria-label="Stufe"><option value="">Alles</option><option value="xfer">Übertragungen</option><option value="info">Info</option><option value="warn">Warnungen</option><option value="error">Fehler</option></select>
      <input class="input" id="lq" placeholder="Filtern nach Benutzer, IP oder Text" style="flex:1;min-width:180px">
      <button class="btn" id="pause">${state.logPaused ? "Weiterlaufen lassen" : "Anhalten"}</button></div>
    <div class="panel logbox" id="logbox" tabindex="0"></div>`;
  $("#lvl").onchange = drawLogs; $("#lq").oninput = drawLogs;
  $("#pause").onclick = e => { state.logPaused = !state.logPaused; e.target.textContent = state.logPaused ? "Weiterlaufen lassen" : "Anhalten"; };
  wireLogTabs();
  drawLogs(); loadLogs();
}
async function loadLogs() {
  const n = await api("GET", "/api/logs?since=" + state.logSince).catch(() => null); if (!n) return;
  if (n.length) { state.logSince = n.at(-1).id; state.logs.push(...n); if (state.logs.length > 2000) state.logs = state.logs.slice(-2000); drawLogs(); }
}
const LV = { info: "Info", warn: "Warnung", error: "Fehler", xfer: "Datei" };
function drawLogs() {
  const box = $("#logbox"); if (!box) return;
  const lv = $("#lvl").value, q = $("#lq").value.toLowerCase();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const shown = state.logs.filter(e => (!lv || e.level === lv) && (!q || (e.msg + " " + (e.user || "") + " " + (e.ip || "")).toLowerCase().includes(q)));
  box.innerHTML = shown.length ? shown.map(e => `<div class="logline lv-${e.level}"><span class="t">${fmtTime(e.time)}</span> <span class="l">${LV[e.level] || e.level}</span>${e.session ? `<span class="w">${esc(e.user || "–")} @ ${esc(e.ip)}</span>  ` : ""}${esc(e.msg)}</div>`).join("") : `<div class="empty">Keine Einträge</div>`;
  if (atBottom) box.scrollTop = box.scrollHeight;
}

const logTabs = cur => `<div class="seg" style="margin-bottom:14px"><button type="button" data-lt="live" aria-pressed="${cur === "live"}">Betrieb</button><button type="button" data-lt="audit" aria-pressed="${cur === "audit"}">Änderungen in der Verwaltung</button></div>`;
const wireLogTabs = () => $$("[data-lt]").forEach(b => b.onclick = () => { state.logTab = b.dataset.lt; viewLogs(); });
async function viewAudit() {
  setHead("Protokoll", "Wer wann was in der Verwaltung geändert hat");
  const list = await api("GET", "/api/audit").catch(() => []);
  $("#main").innerHTML = `${logTabs("audit")}<div class="panel" style="overflow:auto"><table class="data"><thead><tr><th>Zeit</th><th>Änderung</th><th>Betrifft</th><th>IP-Adresse</th></tr></thead><tbody>
    ${list.length ? list.map(e => `<tr><td style="white-space:nowrap">${fmtDate(e.time)}</td><td>${esc(e.action)}</td><td class="mono" style="font-size:12px;word-break:break-word">${esc(e.detail || "")}</td><td class="mono">${esc(e.ip)}</td></tr>`).join("")
      : `<tr><td colspan="4"><div class="empty"><b>Noch keine Änderungen</b>Hier erscheint jede Änderung an Benutzern, Links und Einstellungen.</div></td></tr>`}</tbody></table></div>`;
  wireLogTabs();
}

// ---------- Sperren ----------
async function viewBans() {
  setHead("Sperren", "IP-Adressen, die nach zu vielen Fehlversuchen vorübergehend gesperrt sind");
  const list = await api("GET", "/api/bans").catch(() => []);
  $("#main").innerHTML = `<div class="panel"><table class="data"><thead><tr><th>IP-Adresse</th><th>Gesperrt bis</th><th></th></tr></thead><tbody>${list.length ? list.map(b => `<tr><td class="mono">${esc(b.ip)}</td><td>${fmtDate(b.until)}</td><td style="text-align:right"><button class="btn small" data-ub="${esc(b.ip)}">Sperre aufheben</button></td></tr>`).join("") : `<tr><td colspan="3"><div class="empty"><b>Keine Sperren</b>Die Einstellungen dazu stehen unter Einstellungen → Sicherheit.</div></td></tr>`}</tbody></table></div>`;
  $$("[data-ub]").forEach(b => b.onclick = async () => { await api("DELETE", "/api/bans/" + encodeURIComponent(b.dataset.ub)); toast("Sperre aufgehoben"); viewBans(); tick(); });
}

boot();
</script>
</body>
</html>
