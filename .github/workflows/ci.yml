name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prüfen
        run: go vet -mod=vendor ./...
      - name: Testen
        run: go test -mod=vendor -count=1 ./...
      - name: Testen mit Race-Detektor
        if: matrix.os == 'ubuntu-latest'
        run: go test -mod=vendor -race -count=1 ./...
